version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=tasksphere_prod_secret_pass
      - DB_NAME=tasksphere
      - DB_PORT=3306
      - JWT_SECRET=tasksphere_jwt_production_secret_key_2026_change_me
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tasksphere_prod_secret_pass
      MYSQL_DATABASE: tasksphere
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
